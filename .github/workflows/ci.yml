name: CI

on: [push]

jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer

    strategy:
      matrix:
        include:
          - runner: macos-26
            xcode: "26.6"
          - runner: xcode-27
            xcode: "27.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v1
      - name: Build and Test
        run: xcrun swift test

  linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        swift: ["5.3", "6.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build and Test
        env:
          SWIFT_VERSION: ${{ matrix.swift }}
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/src" --workdir /src \
            "swift:$SWIFT_VERSION" swift test --enable-test-discovery
